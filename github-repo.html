<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splunk Advanced Course - GitHub Repository</title>
    <!-- Uncomment line below to auto-redirect after 3 seconds -->
    <!-- <meta http-equiv="refresh" content="3;url=https://github.com/jwkidd3/splunk_adv_v3"> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .logo {
            font-size: 72px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #718096;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .version {
            display: inline-block;
            background: #f7fafc;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .github-link {
            display: inline-block;
            background: #24292e;
            color: white;
            text-decoration: none;
            padding: 18px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .github-link:hover {
            background: #000000;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .github-link:active {
            transform: translateY(0);
        }

        .github-icon {
            display: inline-block;
            margin-right: 10px;
            font-size: 24px;
            vertical-align: middle;
        }

        .url-display {
            margin-top: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 8px;
            border: 2px dashed #cbd5e0;
        }

        .url-display code {
            color: #667eea;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
        }

        .stats {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat {
            flex: 1;
            min-width: 150px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            display: block;
        }

        .stat-label {
            font-size: 14px;
            color: #718096;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 16px;
            }

            .github-link {
                font-size: 16px;
                padding: 14px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📚</div>
        <h1>Splunk Advanced Course</h1>
        <p class="subtitle">Level 2 - Comprehensive Training</p>
        <div class="version">Version 3.0</div>

        <a href="https://github.com/jwkidd3/splunk_adv_v3" class="github-link" target="_blank" rel="noopener noreferrer">
            <span class="github-icon">⚡</span>
            View on GitHub
        </a>

        <div class="url-display">
            <code>https://github.com/jwkidd3/splunk_adv_v3</code>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-value">15</span>
                <div class="stat-label">Hands-on Labs</div>
            </div>
            <div class="stat">
                <span class="stat-value">6</span>
                <div class="stat-label">Presentations</div>
            </div>
            <div class="stat">
                <span class="stat-value">90</span>
                <div class="stat-label">Automated Tests</div>
            </div>
        </div>
    </div>
</body>
</html>
